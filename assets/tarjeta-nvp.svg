<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-hidden="false">
  <defs>
    <linearGradient id="fondo-tarjeta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003399" />
      <stop offset="1" stop-color="#0a0624" />
    </linearGradient>
    <linearGradient id="franja-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6007e" />
      <stop offset="1" stop-color="#ff4fb0" />
    </linearGradient>
    <filter id="brillo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="difuminado" />
      <feMerge>
        <feMergeNode in="difuminado" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="508" height="318" rx="24" fill="#000000" opacity="0.45" />

  <rect
    x="2"
    y="0"
    width="510"
    height="318"
    rx="22"
    fill="url(#fondo-tarjeta)"
    stroke="rgba(255,255,255,0.12)"
  />

  <g transform="rotate(-14 300 165)">
    <rect x="120" y="140" width="400" height="54" fill="url(#franja-neon)" />
  </g>

  <text
    x="44"
    y="76"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="2"
  >
    nvp
  </text>

  <g filter="url(#brillo)">
    <text
      x="44"
      y="126"
      font-family="ui-sans-serif, system-ui, sans-serif"
      font-size="18"
      font-weight="600"
      fill="#e6007e"
    >
      TU CUPÓN, TU PREMIO
    </text>
  </g>

  <g filter="url(#brillo)">
    <text
      x="44"
      y="258"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="26"
      font-weight="600"
      fill="#ffffff"
      letter-spacing="3"
    >
      NVP-XXXX-XXXX
    </text>
  </g>
</svg>